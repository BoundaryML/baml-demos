[package]
name = "baml_email_agent"

[toolchain]
version = "0.15.1-nightly.20260810.b"

# Generate a typed Python (Pydantic v2) SDK next to the bridge script.
# `baml generate` emits `./baml_sdk/` which `run_campaign.py` imports.
[generator.app]
output_type = "python/pydantic"
output_dir = "."
naming_convention = "preserve-case"
